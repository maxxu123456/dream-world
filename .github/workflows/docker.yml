name: Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker.yml
  # Rebuild weekly so :latest tracks the upstream server, which is cloned at
  # build time from its HEAD.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dream-world:latest
            ghcr.io/${{ github.repository_owner }}/dream-world:${{ github.sha }}
