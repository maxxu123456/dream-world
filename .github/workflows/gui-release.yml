name: Release desktop GUI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: dream-world-gui-macos-aarch64
            executable: dream-world-gui
            asset: dream-world-gui-macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: dream-world-gui-macos-x86_64
            executable: dream-world-gui
            asset: dream-world-gui-macos-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dream-world-gui-windows-x86_64
            executable: dream-world-gui.exe
            asset: dream-world-gui-windows-x86_64.exe
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dream-world-gui-linux-x86_64
            executable: dream-world-gui
            asset: dream-world-gui-linux-x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --manifest-path gui/Cargo.toml --target ${{ matrix.target }}

      - name: Name Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "gui/target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Name Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "gui/target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.asset }}"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dream World $RELEASE_TAG" \
              --generate-notes
          fi
